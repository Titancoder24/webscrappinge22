<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataForge</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <div class="logo">
          <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="url(#logo-grad)"/>
            <path d="M2 17l10 5 10-5" stroke="url(#logo-grad)" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M2 12l10 5 10-5" stroke="url(#logo-grad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#8B5CF6"/>
                <stop offset="100%" stop-color="#10B981"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="logo-text">DataForge</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-bar" id="navbar">
      <button class="nav-tab active" data-tab="tools">TOOLS</button>
      <button class="nav-tab" data-tab="history">HISTORY</button>
      <button class="nav-tab" data-tab="data">DATA</button>
    </nav>

    <!-- Main Content Area -->
    <main class="content" id="content">
      <!-- Dynamically rendered by app.js -->
    </main>

    <!-- Bottom Bar (shown during extraction) -->
    <footer class="bottombar hidden" id="bottombar">
      <div class="bottom-progress">
        <span class="bottom-count" id="bottom-count">0</span>
        <span class="bottom-label">items</span>
        <span class="bottom-separator">|</span>
        <span class="bottom-time" id="bottom-time">0:00</span>
      </div>
      <div class="bottom-actions">
        <button class="btn btn-sm btn-ghost" id="btn-bottom-pause">Pause</button>
        <button class="btn btn-sm btn-danger-ghost" id="btn-bottom-stop">Stop</button>
      </div>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Scripts -->
  <script src="store.js"></script>
  <script src="components/shared.js"></script>
  <script src="components/tools-menu.js"></script>
  <script src="components/list-extractor.js"></script>
  <script src="components/page-extractor.js"></script>
  <script src="components/email-extractor.js"></script>
  <script src="components/image-downloader.js"></script>
  <script src="components/text-extractor.js"></script>
  <script src="components/data-table.js"></script>
  <script src="components/history-view.js"></script>
  <script src="components/settings-view.js"></script>
  <script src="components/templates-view.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/export-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
